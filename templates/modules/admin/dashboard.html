{% extends 'shared/base.html' %}
{% load static %}
{% block title %}Panel de operaciones — Óptica Matiz Visión{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'modules/admin/dashboard.css' %}" />
<link rel="stylesheet" href="{% static 'modules/admin/admin-responsive.css' %}" />

<style id="mv-admin-resp-inline">
@media (max-width: 860px){
  body{overflow-x:hidden !important;}
  .mv-dash-wrap,.mv-ad-wrap{grid-template-columns:1fr !important;gap:.75rem !important;}
  .mv-dash-side,.mv-ad-side{display:flex !important;flex-direction:row !important;flex-wrap:wrap !important;gap:.4rem !important;padding:.6rem !important;position:static !important;overflow:visible !important;}
  .mv-dash-side .mv-side-item,.mv-ad-side button{flex:0 0 auto !important;width:auto !important;display:inline-flex !important;align-items:center !important;gap:.35rem !important;padding:.55rem .9rem !important;min-height:44px !important;border-radius:999px !important;font-size:.85rem !important;white-space:nowrap !important;}
  .mv-dash-side .mv-side-item.active,.mv-ad-side button.active{background:var(--green-dark) !important;color:#fff !important;}
  .mv-dash-panel,.mv-ad-panel{padding:1rem .9rem !important;}
  /* En móviles (< 768px): Las tablas se transforman en Tarjetas de Datos (Data Cards) */
  @media (max-width: 767.98px) {
    .mv-dash-table, .mv-ad-table { display: block !important; width: 100% !important; border: none !important; }
    .mv-dash-table thead, .mv-ad-table thead { display: none !important; }
    .mv-dash-table tbody, .mv-ad-table tbody { display: flex !important; flex-direction: column !important; gap: .85rem !important; }
    .mv-dash-table tr, .mv-ad-table tr { display: flex !important; flex-direction: column !important; background: #fff !important; border: 1px solid var(--border-color, #e5e7eb) !important; border-radius: 16px !important; padding: 1rem 1.15rem !important; box-shadow: 0 4px 14px rgba(31,41,55,.05) !important; gap: .4rem !important; }
    .mv-dash-table td, .mv-ad-table td { display: flex !important; justify-content: space-between !important; align-items: center !important; padding: .45rem 0 !important; border: none !important; border-bottom: 1px dashed rgba(229,231,235,.8) !important; white-space: normal !important; text-align: right !important; }
    .mv-dash-table td[data-label]::before, .mv-ad-table td[data-label]::before { content: attr(data-label); font-weight: 700; font-size: .74rem; text-transform: uppercase; color: var(--lead-muted, #6B7280); text-align: left; }
    .mv-dash-table td:last-child, .mv-ad-table td:last-child, .mv-ad-actions, .mv-td-actions { border-bottom: none !important; border-top: 1px solid var(--border-color, #e5e7eb) !important; margin-top: .5rem !important; padding-top: .75rem !important; display: flex !important; flex-wrap: wrap !important; justify-content: flex-end !important; gap: .5rem !important; }
    .mv-dash-table td:last-child::before, .mv-ad-table td:last-child::before, .mv-ad-actions::before, .mv-td-actions::before { display: none !important; }
    .mv-ad-actions button, .mv-td-actions .btn, .mv-dash-table td:last-child .btn { min-height: 44px !important; min-width: 44px !important; padding: .5rem .95rem !important; font-size: .85rem !important; border-radius: 10px !important; flex-grow: 1 !important; }
  }
  .mv-ad-actions button,.mv-cita-actions button{min-width:40px !important;min-height:40px !important;}
  .mv-ad-head{flex-direction:column;align-items:stretch !important;gap:.6rem !important;}
  .mv-ad-head .btn{width:100%;min-height:44px;}
  .mv-ad-modal{padding:0 !important;align-items:stretch !important;}
  .mv-ad-modal-card{max-width:none !important;height:100% !important;max-height:none !important;border-radius:0 !important;padding:1.25rem 1rem calc(1.25rem + env(safe-area-inset-bottom,0px)) !important;}
  .mv-ad-field input,.mv-ad-field select,.mv-ad-field textarea{font-size:16px !important;min-height:44px !important;}
  .mv-ad-foot{flex-direction:column-reverse !important;}
  .mv-ad-foot button{width:100% !important;min-height:48px !important;margin:0 !important;}
  .mv-ad-stats,.mv-in-stats{grid-template-columns:1fr 1fr !important;}
  .mv-dev-card{padding:.9rem !important;}
  .mv-dev-actions{flex-direction:column !important;width:100%;}
  .mv-dev-actions .btn{width:100% !important;min-height:44px !important;}
  .mv-cita-row{flex-direction:column !important;align-items:flex-start !important;}
}
</style>
{% endblock %}
{% block content %}
<div id="dash-root">
  <div class="mv-empty">Cargando panel…</div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{% static 'modules/admin/dashboard.js' %}"></script>
<script src="/static/modules/admin/panel_quiebre.js"></script>
{% endblock %}
