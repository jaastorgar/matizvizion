{% extends 'shared/base.html' %}
{% load static %}
{% block title %}Administración — Matizvisión{% endblock %}
{% block extra_css %}
<style>
  @keyframes mvAdRise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  .mv-ad-shell { position: relative; border-radius: 22px; padding: clamp(1rem, 3vw, 2rem);
    background: radial-gradient(rgba(31,41,55,.03) 1px, transparent 1.4px) 0 0 / 22px 22px,
      radial-gradient(900px 440px at 92% -12%, rgba(16,185,129,.10), transparent 62%), var(--white, #fff);
    box-shadow: 0 16px 44px rgba(31,41,55,.07); animation: mvAdRise .5s ease both; }
  .mv-ad-wrap { display: grid; grid-template-columns: 230px 1fr; gap: 1.2rem; }
  @media (max-width: 860px){ .mv-ad-wrap { grid-template-columns: 1fr; } }
  .mv-ad-side { border: 1px solid var(--border-color); border-radius: var(--radius); background: var(--white); padding: .9rem; height: fit-content; box-shadow: var(--shadow); }
  .mv-ad-side button { display: flex; align-items: center; gap: .55rem; width: 100%; text-align: left; border: none; background: none; padding: .6rem .75rem; border-radius: 9px; font-weight: 700; color: var(--lead-dark); cursor: pointer; transition: background .13s ease; }
  .mv-ad-side button:hover { background: var(--lead-light); }
  .mv-ad-side button.active { background: rgba(16,185,129,.13); color: var(--green-dark); }
  .mv-ad-side button i { color: var(--green-dark); }
  .mv-ad-panel { border: 1px solid var(--border-color); border-radius: var(--radius); background: var(--white); padding: 1.3rem; box-shadow: var(--shadow); }
  .mv-ad-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .mv-ad-title { font-family: var(--font-head); font-weight: 800; font-size: 1.3rem; color: var(--lead-dark); }
  .mv-ad-table { width: 100%; border-collapse: collapse; }
  .mv-ad-table th, .mv-ad-table td { padding: .6rem .5rem; border-bottom: 1px solid var(--border-color); text-align: left; font-size: .9rem; }
  .mv-ad-table th { color: var(--lead-muted, #6B7280); text-transform: uppercase; font-size: .7rem; letter-spacing: .04em; }
  .mv-ad-actions button { border: 1px solid var(--border-color); background: var(--white); border-radius: 8px; padding: .3rem .6rem; font-size: .78rem; font-weight: 700; cursor: pointer; margin-right: .3rem; }
  .mv-ad-actions .edit:hover { border-color: var(--green-primary); color: var(--green-dark); }
  .mv-ad-actions .del { color: #b91c1c; }
  .mv-ad-actions .del:hover { background: rgba(220,38,38,.08); }
  .mv-ad-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .8rem; }
  .mv-ad-stat { border: 1px solid var(--border-color); border-radius: 14px; padding: .9rem 1rem; background: var(--white); }
  .mv-ad-stat .n { font-family: var(--font-head); font-weight: 800; font-size: 1.8rem; color: var(--green-dark); }
  .mv-ad-stat .l { font-size: .74rem; color: var(--lead-muted, #6B7280); }
  .mv-ad-modal { position: fixed; inset: 0; z-index: 2060; display: none; align-items: center; justify-content: center; background: rgba(17,24,39,.55); backdrop-filter: blur(3px); padding: 1rem; }
  .mv-ad-modal.open { display: flex; }
  .mv-ad-modal-card { width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; background: var(--white); border-radius: 18px; padding: 1.6rem 1.7rem; box-shadow: 0 30px 70px rgba(17,24,39,.4); }
  .mv-ad-modal-card h3 { font-family: var(--font-head); font-weight: 800; margin: 0 0 1rem; color: var(--lead-dark); }
  .mv-ad-field { margin-bottom: .9rem; }
  .mv-ad-field label { display: block; font-size: .74rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--lead-muted, #6B7280); margin-bottom: .3rem; }
  .mv-ad-field input, .mv-ad-field select, .mv-ad-field textarea { width: 100%; border: 1px solid var(--border-color); border-radius: 10px; padding: .55rem .7rem; font-family: inherit; font-size: .92rem; box-sizing: border-box; }
  .mv-ad-field input:focus, .mv-ad-field select:focus, .mv-ad-field textarea:focus { outline: none; border-color: var(--green-primary); box-shadow: 0 0 0 3px rgba(16,185,129,.16); }
  .mv-ad-foot { display: flex; justify-content: flex-end; gap: .6rem; margin-top: 1.1rem; }
</style>
  <link rel="stylesheet" href="{% static 'modules/admin/admin-responsive.css' %}" />


<style id="mv-admin-resp-inline">
@media (max-width: 860px){
  body{overflow-x:hidden !important;}
  .mv-dash-wrap,.mv-ad-wrap{grid-template-columns:1fr !important;gap:.75rem !important;}
  .mv-dash-side,.mv-ad-side{display:flex !important;flex-direction:row !important;flex-wrap:wrap !important;gap:.4rem !important;padding:.6rem !important;position:static !important;overflow:visible !important;}
  .mv-dash-side .mv-side-item,.mv-ad-side button{flex:0 0 auto !important;width:auto !important;display:inline-flex !important;align-items:center !important;gap:.35rem !important;padding:.55rem .9rem !important;min-height:44px !important;border-radius:999px !important;font-size:.85rem !important;white-space:nowrap !important;}
  .mv-dash-side .mv-side-item.active,.mv-ad-side button.active{background:var(--green-dark) !important;color:#fff !important;}
  .mv-dash-panel,.mv-ad-panel{padding:1rem .9rem !important;}
  .mv-dash-table,.mv-ad-table{display:block !important;overflow-x:auto !important;-webkit-overflow-scrolling:touch !important;width:100% !important;}
  .mv-dash-table th,.mv-dash-table td,.mv-ad-table th,.mv-ad-table td{white-space:nowrap !important;font-size:.85rem !important;}
  .mv-ad-actions button,.mv-cita-actions button{min-width:40px !important;min-height:40px !important;}
  .mv-ad-head{flex-direction:column;align-items:stretch !important;gap:.6rem !important;}
  .mv-ad-head .btn{width:100%;min-height:44px;}
  .mv-ad-modal{padding:0 !important;align-items:stretch !important;}
  .mv-ad-modal-card{max-width:none !important;height:100% !important;max-height:none !important;border-radius:0 !important;padding:1.25rem 1rem calc(1.25rem + env(safe-area-inset-bottom,0px)) !important;}
  .mv-ad-field input,.mv-ad-field select,.mv-ad-field textarea{font-size:16px !important;min-height:44px !important;}
  .mv-ad-foot{flex-direction:column-reverse !important;}
  .mv-ad-foot button{width:100% !important;min-height:48px !important;margin:0 !important;}
  .mv-ad-stats,.mv-in-stats{grid-template-columns:1fr 1fr !important;}
  .mv-dev-card{padding:.9rem !important;}
  .mv-dev-actions{flex-direction:column !important;width:100%;}
  .mv-dev-actions .btn{width:100% !important;min-height:44px !important;}
  .mv-cita-row{flex-direction:column !important;align-items:flex-start !important;}
}
</style>
{% endblock %}
{% block content %}
<div class="mv-ad-shell">
  <div class="mv-ad-wrap">
    <aside class="mv-ad-side" id="ad-side"></aside>
    <section class="mv-ad-panel">
      <div class="mv-ad-head">
        <div class="mv-ad-title" id="ad-title">Resumen</div>
        <button class="btn btn-cta btn-sm" id="ad-new" hidden><i class="bi bi-plus-lg"></i> Nuevo</button>
      </div>
      <div id="ad-body"></div>
    </section>
  </div>
</div>
<div class="mv-ad-modal" id="ad-modal"><div class="mv-ad-modal-card" id="ad-modal-card"></div></div>
{% endblock %}
{% block extra_js %}<script src="{% static 'modules/admin/administracion.js' %}?v=4"></script>{% endblock %}
